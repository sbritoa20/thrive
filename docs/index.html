<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="description" content="Tus horas, tu plata y tu gym en un solo lugar.">
<title>Thrive</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="view"></main>

<nav class="tabbar" aria-label="Secciones">
  <button type="button" data-tab="trabajo">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <span>Trabajo</span>
  </button>
  <button type="button" data-tab="dinero">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h13a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3z"/><path d="M5 6l10-3 1 3"/><path d="M16 13h2"/></svg>
    <span>Dinero</span>
  </button>
  <button type="button" data-tab="gym">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>
    <span>Gym</span>
  </button>
  <button type="button" data-tab="ajustes">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
    <span>Ajustes</span>
  </button>
</nav>

<div id="sheet" class="sheet-wrap" hidden>
  <div class="sheet-backdrop" data-act="closeSheet"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Formulario">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div id="sheetBody"></div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="photoInput" accept="image/*" hidden>
<input type="file" id="importInput" accept="application/json,.json" hidden>
<script src="app.js"></script>
</body>
</html>
